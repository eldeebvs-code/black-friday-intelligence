name: Egypt Price Watcher
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths: ['watcher.py', 'product_pages.py', 'catalogue.py', 'health.py', 'robots.py', 'status_page.py', 'config.json', '.github/workflows/watch.yml']
  workflow_dispatch:
    inputs:
      test_telegram:
        description: Send a Telegram connection test
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: egypt-price-watcher
  cancel-in-progress: false
jobs:
  watch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tests before monitoring
        run: python -m unittest discover -s tests -v
      - name: Telegram connection test
        if: github.event_name == 'workflow_dispatch' && inputs.test_telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py --test-telegram
      - name: Collect and verify prices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py --notify
      - name: Persist price history and successful notification IDs
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update observed prices and watcher health [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve recovery copy and health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-state-${{ github.run_id }}
          path: data/
          retention-days: 14
      - name: Run summary
        if: always()
        run: |
          echo '### Price watcher health' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/status.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
