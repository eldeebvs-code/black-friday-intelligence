name: Tests
on:
  push:
    paths-ignore: ['data/**', '**.md']
  pull_request:
    paths-ignore: ['data/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
